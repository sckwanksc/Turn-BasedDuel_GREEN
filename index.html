<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>綠色創科大冒險：科技與環保雙人對戰棋盤</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
    }
    body {
      background: #064e3b;
      background: radial-gradient(circle at top, #065f46 0%, #022c22 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    #game-container {
      width: 100%;
      max-width: 900px;
      background: #0f172a;
      border: 2px solid #10b981;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 頂部 HUD：雙人即時狀態 */
    .hud-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: #022c22;
      border-bottom: 2px solid #059669;
      padding: 10px 16px;
      gap: 10px;
    }
    .player-card {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 2px solid transparent;
      transition: all 0.3s;
    }
    .player-card.active-p1 {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    .player-card.active-p2 {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .player-title { font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .p1-color { color: #34d399; }
    .p2-color { color: #38bdf8; }
    .player-stat { font-size: 13px; margin-top: 4px; display: flex; justify-content: space-between; }

    .turn-indicator {
      text-align: center;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      background: #1e293b;
      border: 1px solid #475569;
    }

    /* 棋盤主體區（Grid 格子賽道） */
    .board-wrapper {
      padding: 16px;
      background: #0b1329;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 820px;
    }
    .tile {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 4px;
      transition: all 0.2s;
    }
    .tile-num {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 10px;
      color: #64748b;
    }
    .tile-icon { font-size: 20px; margin-bottom: 2px; }

    /* 格子類型樣式 */
    .tile-start { background: rgba(16, 185, 129, 0.2); border-color: #10b981; }
    .tile-end { background: rgba(234, 179, 8, 0.2); border-color: #eab308; }
    .tile-question { background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; }
    .tile-chance { background: rgba(168, 85, 247, 0.15); border-color: #a855f7; }
    .tile-boost { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; }
    .tile-trap { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; }

    /* 棋子標記 (Tokens) */
    .tokens-container {
      position: absolute;
      bottom: 4px;
      display: flex;
      gap: 3px;
    }
    .token {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      box-shadow: 0 0 6px rgba(0,0,0,0.8);
    }
    .token-p1 { background: #10b981; color: #022c22; border: 1.5px solid #fff; }
    .token-p2 { background: #0284c7; color: #fff; border: 1.5px solid #fff; }

    /* 底部操作控制台 */
    .control-console {
      background: #022c22;
      border-top: 2px solid #059669;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .action-prompt {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .action-prompt b { color: #f8fafc; }
    .dice-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .dice-cube {
      width: 52px;
      height: 52px;
      background: #f8fafc;
      color: #0f172a;
      border-radius: 12px;
      font-size: 28px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 0 #cbd5e1;
      border: 2px solid #94a3b8;
      transition: transform 0.1s;
    }
    .dice-rolling {
      animation: diceRoll 0.3s infinite linear;
    }
    @keyframes diceRoll {
      0% { transform: rotate(0deg) scale(0.9); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(0.9); }
    }

    .btn-roll {
      background: #10b981;
      color: #022c22;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }
    .btn-roll:hover:not(:disabled) { background: #34d399; transform: scale(1.03); }
    .btn-roll:disabled { background: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; }

    /* 彈窗（登入、問答、機會卡、結算） */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .modal-overlay.hidden { display: none !important; }

    .modal-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 18px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .btn-action {
      background: #10b981;
      color: #022c22;
      font-weight: 800;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      padding: 12px 26px;
      cursor: pointer;
      margin-top: 14px;
      transition: all 0.2s;
    }
    .btn-action:hover { background: #34d399; transform: translateY(-1px); }

    /* 登入表單雙欄 */
    .login-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      margin: 16px 0;
      text-align: left;
    }
    .player-input-box {
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .player-input-box label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 6px;
      margin-bottom: 2px;
    }
    .player-input-box input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .player-input-box input:focus {
      border-color: #38bdf8;
    }

    /* 題目卡選項按鈕 */
    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin: 8px 0;
      background: #0f172a;
      border: 2px solid #334155;
      color: #f8fafc;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.4;
    }
    .opt-btn:hover { border-color: #38bdf8; background: #1e293b; }
    .opt-btn.correct { border-color: #10b981; background: rgba(16, 185, 129, 0.2); }
    .opt-btn.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

    .explanation-box {
      background: #0f172a;
      border-left: 4px solid #10b981;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      color: #94a3b8;
      text-align: left;
      margin-top: 10px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .board-grid { gap: 4px; }
      .tile { font-size: 9px; padding: 2px; }
      .tile-icon { font-size: 15px; }
      .login-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 頂部 HUD：雙人對戰資訊 -->
    <div class="hud-bar">
      <!-- 玩家 1 狀態 -->
      <div class="player-card active-p1" id="p1-card">
        <div class="player-title p1-color">🌿 P1: <span id="p1-name-display">3A(01)</span></div>
        <div class="player-stat">
          <span>積分: <b id="p1-score">0</b></span>
          <span id="p1-hearts">❤️❤️❤️</span>
        </div>
      </div>

      <!-- 回合狀態 -->
      <div class="turn-indicator" id="turn-banner">
        當前輪到：<span style="color:#34d399;">P1 行動</span>
      </div>

      <!-- 玩家 2 狀態 -->
      <div class="player-card" id="p2-card">
        <div class="player-title p2-color">⚡ P2: <span id="p2-name-display">3A(02)</span></div>
        <div class="player-stat">
          <span>積分: <b id="p2-score">0</b></span>
          <span id="p2-hearts">❤️❤️❤️</span>
        </div>
      </div>
    </div>

    <!-- 棋盤主體賽道 (28格) -->
    <div class="board-wrapper">
      <div class="board-grid" id="boardGrid"></div>
    </div>

    <!-- 底部控制台 -->
    <div class="control-console">
      <div class="action-prompt">
        <span id="prompt-main"><b>微步骰子對抗中</b></span>
        <span style="font-size:12px; color:#6ee7b7;">點數範圍：1～3 點（高頻觸發題目卡）</span>
      </div>

      <div class="dice-area">
        <div class="dice-cube" id="diceBox">?</div>
        <button class="btn-roll" id="rollBtn" onclick="rollDice()">擲骰前進</button>
      </div>
    </div>

    <!-- 1. 雙人登入登記視窗 -->
    <div class="modal-overlay" id="loginModal">
      <div class="modal-card">
        <h2 style="color:#34d399; margin-bottom:8px;">🌿 綠色創科雙人對戰 ⚡</h2>
        <p style="font-size:13px; color:#94a3b8; line-height:1.5;">
          兩位同學輪流擲骰（最多 3 點），踩中格子需回答前沿「科技與環保」題目或領取機會卡。先抵達碳中和終點或積分最高者勝出！
        </p>

        <div class="login-grid">
          <!-- 玩家 1 -->
          <div class="player-input-box" style="border-top:3px solid #10b981;">
            <b class="p1-color">特工 1 (綠隊)</b>
            <label>班別</label>
            <input type="text" id="p1-cls" value="3A" placeholder="例: 3A" maxlength="6">
            <label>學號</label>
            <input type="number" id="p1-no" value="01" placeholder="例: 12">
          </div>
          <!-- 玩家 2 -->
          <div class="player-input-box" style="border-top:3px solid #38bdf8;">
            <b class="p2-color">特工 2 (藍隊)</b>
            <label>班別</label>
            <input type="text" id="p2-cls" value="3A" placeholder="例: 3A" maxlength="6">
            <label>學號</label>
            <input type="number" id="p2-no" value="02" placeholder="例: 25">
          </div>
        </div>

        <button class="btn-action" id="startGameBtn" onclick="startGame()">建立特工對決，開始遊戲！</button>
      </div>
    </div>

    <!-- 2. 題目卡彈出視窗 -->
    <div class="modal-overlay hidden" id="questionModal">
      <div class="modal-card" style="max-width:540px;">
        <span style="font-size:11px; color:#38bdf8; font-weight:bold; letter-spacing:1px;" id="q-category">【綠色科技思考】</span>
        <h3 id="q-title" style="margin:8px 0 14px 0; font-size:16px; color:#f8fafc; line-height:1.5;">題目載入中...</h3>

        <div style="width:100%;" id="q-options"></div>

        <div id="q-feedback" class="explanation-box hidden"></div>
        <button class="btn-action hidden" id="q-next-btn" onclick="closeQuestionModal()">確定並換下一位特工</button>
      </div>
    </div>

    <!-- 3. 機會卡彈出視窗 -->
    <div class="modal-overlay hidden" id="chanceModal">
      <div class="modal-card">
        <div style="font-size:42px; margin-bottom:8px;">🔮</div>
        <h3 style="color:#c084fc; margin-bottom:6px;">【機會命運卡】</h3>
        <p id="chance-title" style="font-size:16px; font-weight:800; color:#f8fafc; margin-bottom:10px;"></p>
        <p id="chance-desc" style="font-size:13px; color:#94a3b8; line-height:1.5;"></p>
        <button class="btn-action" onclick="closeChanceModal()">領取事件後續</button>
      </div>
    </div>

    <!-- 4. 遊戲結算與排行榜視窗 -->
    <div class="modal-overlay hidden" id="endModal">
      <div class="modal-card" style="max-width:500px;">
        <h2 id="end-winner-text" style="color:#facc15; margin-bottom:6px;">🎉 碳中和對抗賽結束！</h2>
        <p id="end-summary" style="font-size:13px; color:#94a3b8; margin-bottom:14px;"></p>

        <div style="display:flex; gap:10px; margin-bottom:14px;">
          <button class="btn-action" onclick="exportCSV()">匯出成績 CSV</button>
          <button class="btn-action" style="background:#475569; color:#fff;" onclick="restartGame()">重新對局</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- 20 題科技與環保擴充題庫 ---
    const QUESTIONS_DB = [
      {
        cat: "AI 能耗與綠色運算",
        q: "大型語言模型（LLM）訓練與數據中心運算時會產生巨額熱能，哪種散熱技術最節能且環保？",
        a: "浸沒式液體冷卻 (Liquid Cooling)",
        b: "增開強力傳統壓縮機冷氣",
        ans: "A",
        exp: "液體的導熱效率遠高於空氣，浸沒式冷卻能大幅降低數據中心的電能使用效率 (PUE)，節省超過 30% 散熱電力。"
      },
      {
        cat: "電子垃圾與資源回收",
        q: "廢棄手機與舊電腦內部電路板含有金、銀、銅等貴金屬，妥善提煉的過程稱為什麼？",
        a: "城市採礦 (Urban Mining)",
        b: "垃圾堆填 (Landfilling)",
        ans: "A",
        exp: "「城市採礦」回收電子廢料中的稀貴金屬，減少開採天然礦石破壞森林生態與減少巨量碳排放。"
      },
      {
        cat: "智慧電網與能源管理",
        q: "智慧電網（Smart Grid）利用物聯網與大數據分析，其主要環保優勢是什麼？",
        a: "動態調度供需，提高太陽能與風能併網穩定性",
        b: "促進燃煤電廠 24 小時滿載運轉",
        ans: "A",
        exp: "智慧電網能預測用電峰值，平衡間歇性再生能源供需，減少備用化石能源發電廠的啟動。"
      },
      {
        cat: "循環經濟與硬體維修",
        q: "許多科技廠商推動「模組化手機（Modular Phone）」設計，其核心環保理念是：",
        a: "讓使用者能單獨更換損壞零件，延長整機壽命",
        b: "零件越多越難拆解回收",
        ans: "A",
        exp: "模組化設計讓使用者更換故障鏡頭或電池即可，免於直接報廢整支手機，源頭減少電子垃圾。"
      },
      {
        cat: "智慧農業與物聯網",
        q: "智慧溫室結合物聯網土壤感測器與滴灌系統，最主要能達到什麼環保效益？",
        a: "大量噴灑化學肥料",
        b: "精準按需給水，大幅節省水資源達 30-50%",
        ans: "B",
        exp: "IoT 感測器實時監測土壤濕度，只在作物需要時定點微量滴灌，避免傳統大水漫灌的蒸發與浪費。"
      },
      {
        cat: "數據中心選址",
        q: "全球許多雲端巨頭紛紛將伺服器機房設在北歐冰島或深海中，主要考量是什麼？",
        a: "利用低溫自然冷卻，降低冷氣散熱耗電",
        b: "海底網絡訊號傳播速度較快",
        ans: "A",
        exp: "深海水溫或寒帶冷空氣能自然冷卻機房，大幅減免高耗能的冷氣壓縮機電力消耗。"
      },
      {
        cat: "電池科技與梯次利用",
        q: "電動車退役下來的動力鋰電池通常如何進行「二次利用（梯次利用）」？",
        a: "直接焚燒當作燃料",
        b: "降級轉作社區或家庭太陽能儲能系統 (Energy Storage)",
        ans: "B",
        exp: "車用電池退役時通常仍保有約 70% 儲電量，轉用於靜態發電儲能，可發揮全生命週期價值。"
      },
      {
        cat: "綠色軟體與顯示螢幕",
        q: "「暗黑模式（Dark Mode）」在配備哪種螢幕的手機上具有顯著的省電環保效果？",
        a: "OLED / AMOLED 螢幕",
        b: "傳統 LCD 螢幕",
        ans: "A",
        exp: "OLED 的黑色像素是完全關閉不通電發光的，因此在 OLED 螢幕上使用深色模式能大幅延長電池續航。"
      },
      {
        cat: "硬體節能認證",
        q: "購買電腦硬體時，電源供應器標註「80 PLUS 金牌」認證代表什麼意義？",
        a: "電源轉換效率高達 80% 以上，減少無謂發熱與浪費電",
        b: "散熱風扇完全無噪音",
        ans: "A",
        exp: "高轉換效率代表進入電腦的交流電絕大部分轉為可用直流電，大幅減少轉化為廢熱散失的電力。"
      },
      {
        cat: "區塊鏈與碳足跡",
        q: "現代區塊鏈從「工作量證明 (PoW)」升級為「權益證明 (PoS)」，主要環保成果是：",
        a: "消除挖礦算力競賽，全球耗電量驟降超過 99%",
        b: "完全不需要電腦伺服器",
        ans: "A",
        exp: "PoS 模式免除了全球數百萬台顯示卡全天候滿載高耗電運算，讓區塊鏈運行更加節能。"
      },
      {
        cat: "智慧城市照明",
        q: "智慧城市的路燈系統導入光敏感測器與車流偵測，能做到什麼節能機制？",
        a: "深夜無人車經過時自動調降亮度或關閉",

    // --- 12 張機會命運卡 ---

    // --- 棋盤 28 格定義 ---

    // 玩家狀態
    let players = [
      { id: 1, name: "特工1", cls: "3A", no: "01", pos: 0, score: 0, hearts: 3, extraRoll: false },
      { id: 2, name: "特工2", cls: "3A", no: "02", pos: 0, score: 0, hearts: 3, extraRoll: false }
    ];
    let currentTurnIndex = 0; // 0 為 P1，1 為 P2
    let isRolling = false;
    let availableQuestions = [...QUESTIONS_DB];

    // 初始化棋盤 DOM
    function initBoard() {
      const grid = document.getElementById("boardGrid");
      if (!grid) return;
      grid.innerHTML = "";
      BOARD_TILES.forEach((t) => {
        const div = document.createElement("div");
        div.className = `tile tile-${t.type}`;
        div.id = `tile-${t.id}`;
        div.innerHTML = `
          <span class="tile-num">${t.id}</span>
          <div class="tile-icon">${t.icon}</div>
          <div>${t.name}</div>
          <div class="tokens-container" id="token-box-${t.id}"></div>
        `;
        grid.appendChild(div);
      });
      updateTokens();
    }

    // 更新棋子位置
    function updateTokens() {
      for (let i = 0; i < 28; i++) {
        const box = document.getElementById(`token-box-${i}`);
        if (box) box.innerHTML = "";
      }
      const box1 = document.getElementById(`token-box-${players[0].pos}`);
      if (box1) {
        const t1 = document.createElement("div");
        t1.className = "token token-p1";
        t1.textContent = "1";
        box1.appendChild(t1);
      }
      const box2 = document.getElementById(`token-box-${players[1].pos}`);
      if (box2) {
        const t2 = document.createElement("div");
        t2.className = "token token-p2";
        t2.textContent = "2";
        box2.appendChild(t2);
      }
    }

    // 更新 HUD
    function updateHUD() {
      document.getElementById("p1-name-display").textContent = `${players[0].cls}(${players[0].no})`;
      document.getElementById("p2-name-display").textContent = `${players[1].cls}(${players[1].no})`;

      document.getElementById("p1-score").textContent = players[0].score;
      document.getElementById("p2-score").textContent = players[1].score;

      document.getElementById("p1-hearts").textContent = "❤️".repeat(Math.max(0, players[0].hearts));
      document.getElementById("p2-hearts").textContent = "❤️".repeat(Math.max(0, players[1].hearts));

      const p1Card = document.getElementById("p1-card");
      const p2Card = document.getElementById("p2-card");
      const turnBanner = document.getElementById("turn-banner");

      if (currentTurnIndex === 0) {
        p1Card.className = "player-card active-p1";
        p2Card.className = "player-card";
        turnBanner.innerHTML = `當前輪到：<span style="color:#34d399;">P1 行動</span>`;
      } else {
        p1Card.className = "player-card";
        p2Card.className = "player-card active-p2";
        turnBanner.innerHTML = `當前輪到：<span style="color:#38bdf8;">P2 行動</span>`;
      }
    }

    // 啟動遊戲
    function startGame() {
      const c1 = document.getElementById("p1-cls").value.trim().toUpperCase() || "3A";
      const n1 = document.getElementById("p1-no").value.trim() || "01";
      const c2 = document.getElementById("p2-cls").value.trim().toUpperCase() || "3A";
      const n2 = document.getElementById("p2-no").value.trim() || "02";

      players[0].cls = c1; players[0].no = n1;
      players[1].cls = c2; players[1].no = n2;

      document.getElementById("loginModal").classList.add("hidden");
      initBoard();
      updateHUD();
    }

    // 支援輸入框 Enter 快捷鍵直接開始
    document.addEventListener("DOMContentLoaded", () => {
      initBoard();
      ["p1-cls", "p1-no", "p2-cls", "p2-no"].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter") startGame();
          });
        }
      });
    });

    // 擲骰核心機制（最多 3 點：1～3）
    function rollDice() {
      if (isRolling) return;
      isRolling = true;
      const rollBtn = document.getElementById("rollBtn");
      rollBtn.disabled = true;

      const diceBox = document.getElementById("diceBox");
      diceBox.classList.add("dice-rolling");

      let counter = 0;
      const interval = setInterval(() => {
        diceBox.textContent = Math.floor(Math.random() * 3) + 1;
        counter++;
        if (counter > 10) {
          clearInterval(interval);
          const finalPoint = Math.floor(Math.random() * 3) + 1;
          diceBox.textContent = finalPoint;
          diceBox.classList.remove("dice-rolling");
          movePlayer(finalPoint);
        }
      }, 50);
    }

    // 移動特工步數
    function movePlayer(steps) {
      const p = players[currentTurnIndex];
      let targetPos = p.pos + steps;
      if (targetPos >= 27) targetPos = 27;

      let currentStep = p.pos;
      const stepTimer = setInterval(() => {
        if (currentStep < targetPos) {
          currentStep++;
          p.pos = currentStep;
          updateTokens();
        } else {
          clearInterval(stepTimer);
          handleTileLanding(p);
        }
      }, 180);
    }

    // 到達格子事件觸發
    function handleTileLanding(p) {
      const tile = BOARD_TILES[p.pos];

      if (p.pos === 27) {
        p.score += 200;
        updateHUD();
        endGame(`特工 P${p.id} 先鋒抵達碳中和總署！獲得 +200 衝刺獎勵！`);
        return;
      }

      switch (tile.type) {
        case "question":
          triggerQuestionModal();
          break;
        case "chance":
          triggerChanceModal();
          break;
        case "boost":
          p.score += tile.gain;
          alert(`🌿 踩中【${tile.name}】！研發成效顯著，積分 +${tile.gain} 分！`);
          updateHUD();
          finishTurn();
          break;
        case "trap":
          p.score = Math.max(0, p.score - tile.penalty);
          alert(`⚠️ 踩中【${tile.name}】！高耗能洩漏，積分扣減 ${tile.penalty} 分！`);
          updateHUD();
          finishTurn();
          break;
        default:
          finishTurn();
          break;
      }
    }

    // 觸發題目卡
    let currentQ = null;
    function triggerQuestionModal() {
      if (availableQuestions.length === 0) {
        availableQuestions = [...QUESTIONS_DB];
      }
      const qIndex = Math.floor(Math.random() * availableQuestions.length);
      currentQ = availableQuestions.splice(qIndex, 1)[0];

      document.getElementById("q-category").textContent = `【${currentQ.cat}】`;
      document.getElementById("q-title").textContent = currentQ.q;

      const optsBox = document.getElementById("q-options");
      optsBox.innerHTML = `
        <button class="opt-btn" onclick="checkAnswer('A', this)"><b>A.</b> ${currentQ.a}</button>
        <button class="opt-btn" onclick="checkAnswer('B', this)"><b>B.</b> ${currentQ.b}</button>
      `;

      document.getElementById("q-feedback").classList.add("hidden");
      document.getElementById("q-next-btn").classList.add("hidden");
      document.getElementById("questionModal").classList.remove("hidden");
    }

    function checkAnswer(chosen, btn) {
      const p = players[currentTurnIndex];
      const isRight = (chosen === currentQ.ans);

      const allBtns = document.querySelectorAll(".opt-btn");
      allBtns.forEach(b => b.onclick = null);

      const fb = document.getElementById("q-feedback");
      fb.classList.remove("hidden");

      if (isRight) {
        btn.classList.add("correct");
        p.score += 100;
        fb.innerHTML = `<b style="color:#34d399;">🎯 回答完全正確！積分 +100 分！</b><br>${currentQ.exp}`;
      } else {
        btn.classList.add("wrong");
        p.hearts--;
        fb.innerHTML = `<b style="color:#ef4444;">❌ 答案不正確！扣減 1 顆心心！</b>（正確答案是 ${currentQ.ans}）<br>${currentQ.exp}`;
      }

      updateHUD();
      document.getElementById("q-next-btn").classList.remove("hidden");

      if (p.hearts <= 0) {
        closeQuestionModal();
        endGame(`特工 P${p.id} 的碳預算（生命值）耗盡！提前終止對抗！`);
      }
    }

    function closeQuestionModal() {
      document.getElementById("questionModal").classList.add("hidden");
      finishTurn();
    }

    // 觸發機會卡
    function triggerChanceModal() {
      const card = CHANCE_CARDS[Math.floor(Math.random() * CHANCE_CARDS.length)];
      const p = players[currentTurnIndex];
      const other = players[1 - currentTurnIndex];

      document.getElementById("chance-title").textContent = card.title;
      document.getElementById("chance-desc").textContent = card.desc;

      card.action(p, other);
      updateHUD();
      updateTokens();

      document.getElementById("chanceModal").classList.remove("hidden");

      if (p.hearts <= 0 || other.hearts <= 0) {
        document.getElementById("chanceModal").classList.add("hidden");
        endGame("特工碳預算耗盡！遊戲結束！");
      }
    }

    function closeChanceModal() {
      document.getElementById("chanceModal").classList.add("hidden");
      finishTurn();
    }

    // 換人輪流
    function finishTurn() {
      const p = players[currentTurnIndex];
      if (p.extraRoll) {
        p.extraRoll = false;
        alert(`🎉 特工 P${p.id} 獲得太陽能增益，可再多擲一次骰子！`);
      } else {
        currentTurnIndex = 1 - currentTurnIndex;
      }
      updateHUD();
      isRolling = false;
      document.getElementById("rollBtn").disabled = false;
    }

    // 遊戲結算
    function endGame(reason) {
      document.getElementById("endModal").classList.remove("hidden");
      const p1 = players[0];
      const p2 = players[1];

      let winText = "";
      if (p1.score > p2.score) {
        winText = `🏆 優勝者：特工 P1 ${p1.cls}(${p1.no}) 獲勝！`;
      } else if (p2.score > p1.score) {
        winText = `🏆 優勝者：特工 P2 ${p2.cls}(${p2.no}) 獲勝！`;
      } else {
        winText = `🤝 勢均力敵！雙方以 ${p1.score} 分握手言和！`;
      }

      document.getElementById("end-winner-text").textContent = winText;
      document.getElementById("end-summary").innerHTML = `
        <b>${reason}</b><br><br>
        🌿 <b>P1 ${p1.cls}(${p1.no})</b> 最終積分：${p1.score} 分 ｜ 剩餘心心：${p1.hearts}<br>
        ⚡ <b>P2 ${p2.cls}(${p2.no})</b> 最終積分：${p2.score} 分 ｜ 剩餘心心：${p2.hearts}
      `;
    }

    // 匯出 CSV 檔
    function exportCSV() {
      const p1 = players[0];
      const p2 = players[1];
      const now = new Date().toLocaleString();
      let csv = "\uFEFF特工,班別,學號,最終積分,剩餘生命,時間\n";
      csv += `特工1 (綠),${p1.cls},${p1.no},${p1.score},${p1.hearts},"${now}"\n`;
      csv += `特工2 (藍),${p2.cls},${p2.no},${p2.score},${p2.hearts},"${now}"\n`;

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `綠色創科對戰成績_${p1.cls}_${p2.cls}.csv`;
      a.click();
